name: Build Python Installer

on:
  push:
    branches: [ main ] # Запускается при отправке кода в ветку main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10' # Укажите вашу версию Python

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onedir --noconsole main.py # Замените main.py на ваш главный файл

    - name: Create Installer via Inno Setup
      uses: aminya/setup-innosetup@v2
      with:
        inno-version: '6.2.2'

    - name: Compile Installer
      run: |
        # Здесь GitHub автоматически соберет из папки dist готовый установщик
        # Для продвинутой настройки можно прикрепить свой .iss скрипт
        iscc /? 

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-installer
        path: dist/
        
